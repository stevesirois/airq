# Board: Generic ESP32-C6 Board (Generic)
# Definition: definitions/boards/generic-esp32c6/manifest.yaml
# For ESP32-C6 Seeed Studio board

esphome:
  name: airqx
  friendly_name: AirQX

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<your_api_encryption_key>"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: AirQX Fallback Hotspot
    password: "3WYkur2UimMr"

captive_portal:

i2c:
  - id: i2c_1
    scl: GPIO23
    sda: GPIO22

sensor:
  - platform: sen6x
    id: sensor_sen6x_1
    i2c_id: i2c_1
    co2:
      name: CO2
      id: sensor_sen6x_1_co2
    humidity:
      name: Humidity
      id: sensor_sen6x_1_humidity
    nox_index:
      name: NOX Index
      id: sensor_sen6x_1_nox_index
    pm_10_0:
      name: PM 10 0
      id: sensor_sen6x_1_pm_10_0
    pm_1_0:
      name: PM 1 0
      id: sensor_sen6x_1_pm_1_0
    pm_2_5:
      name: PM 2 5
      id: sensor_sen6x_1_pm_2_5
    pm_4_0:
      name: PM 4 0
      id: sensor_sen6x_1_pm_4_0
    temperature:
      name: Temperature
      id: sensor_sen6x_1_temperature
    voc_index:
      name: VOC Index
      id: sensor_sen6x_1_voc_index

    type: SEN66
